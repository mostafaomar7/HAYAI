name: SEO / GEO gates

# The client's "Technical SEO & GEO Specification" (§9) requires two deploy
# gates: structured-data validation and a Core Web Vitals budget. Both run
# against the real server-rendered output, not a dev build, because the whole
# point of the spec is what a crawler receives.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  seo-gate:
    name: Structured data, headings, hreflang, images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx ng build

      - name: Start the SSR server
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.hayaihealthcare.com/api/v1' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://hayaihealthcare.com' }}
          WEBSITE_SERVER_KEY: ${{ secrets.WEBSITE_SERVER_KEY }}
          PORT: 4000
        run: |
          node dist/BAREEQ/server/server.mjs &
          echo $! > server.pid
          npx wait-on -t 60000 http://localhost:4000/en

      - name: SEO / GEO gate
        run: node scripts/seo-gate.mjs http://localhost:4000

      # Nothing hard-coded in a template, the container exactly twice, and
      # consent defaults before the metadata before the container.
      - name: Tracking install gate
        env:
          GTM_ID: ${{ vars.GTM_ID }}
        run: bash scripts/check-tracking.sh http://localhost:4000/en http://localhost:4000/ar http://localhost:4000/en/faq http://localhost:4000/en/products http://localhost:4000/en/doctors

      # Each event fires once, with its required parameters and no personal
      # data — in a real browser, against the server-rendered build. Form
      # submissions are answered inside the test, so no real lead is filed.
      - name: Tracking tests (Playwright)
        env:
          BASE_URL: http://localhost:4000
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tracking-test-results
          path: test-results
          if-no-files-found: ignore

      - name: Stop the server
        if: always()
        run: kill "$(cat server.pid)" || true

  lighthouse:
    name: Core Web Vitals budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx ng build

      - name: Lighthouse CI
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.hayaihealthcare.com/api/v1' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://hayaihealthcare.com' }}
        run: npx -y @lhci/cli@0.14.x autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: ignore
