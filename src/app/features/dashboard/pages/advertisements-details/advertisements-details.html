<div class="details-container">

  <header class="details-header">
    <button class="back-btn" (click)="goBack()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Back
    </button>
    <h1>{{ isEdit() ? 'Edit Advertisement' : 'Add Advertisement' }}</h1>
  </header>

  <form class="form-section" [formGroup]="form" (ngSubmit)="save()">

    <div class="form-group">
      <label>Owner ID</label>
      <input type="number" placeholder="Owner user id" formControlName="owner_id" />
    </div>

    <div class="form-group">
      <label>Redirect link</label>
      <input type="text" placeholder="https://yellowpages.com" formControlName="redirect_link" />
    </div>

    <div class="form-group">
      <label>Status</label>
      <select formControlName="status">
        <option value="active">Active</option>
        <option value="expired">Expired</option>
      </select>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" formControlName="is_published" /> Published
      </label>
    </div>

    <div class="form-group">
      <label>Start date</label>
      <input type="date" formControlName="start_date" />
    </div>

    <div class="form-group">
      <label>End date</label>
      <input type="date" formControlName="end_date" />
    </div>

    <div class="form-group">
      <label>Image</label>

      @if (!uploadedImage()) {
        <label class="upload-box" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px dashed #d1d5db;border-radius:8px;padding:24px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="#3B82F6" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span class="upload-title">Click to upload image</span>
          <span class="upload-subtitle">PNG, JPG up to 10MB</span>
          <input type="file" accept="image/png,image/jpeg,image/jpg" (change)="onFileSelected($event)" style="display:none;" />
        </label>
      } @else {
        <div class="image-preview-container">
          <img [src]="uploadedImage()" alt="Uploaded Preview" class="preview-img" />
          <button type="button" class="remove-btn" (click)="removeImage()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#ffffff" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      }
    </div>

    @if (errorMessage()) {
      <div style="color:#dc2626;font-size:13px;">{{ errorMessage() }}</div>
    }

    <div class="form-actions" style="display:flex;gap:12px;justify-content:flex-end;margin-top:16px;">
      <button type="button" class="btn-cancel" (click)="goBack()">Cancel</button>
      <button type="submit" class="add-btn" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Save' }}</button>
    </div>

  </form>

</div>
