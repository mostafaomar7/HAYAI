<div class="page-container">

  <div class="actions-header">
    <div class="left-actions">
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="#6B7280" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" [placeholder]="'common.search' | t" [value]="search()" (input)="onSearch($any($event.target).value)" />
      </div>

      <div class="filter-wrapper">
        <button class="filter-btn" (click)="toggleFilter($event)">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
          </svg>
          {{ 'common.filter' | t }}
          @if (activeFilterCount() > 0) {
            <span class="filter-count">{{ activeFilterCount() }}</span>
          }
        </button>

        @if (showFilter) {
          <div class="filter-popup" (click)="preventClose($event)">
            <div class="popup-header">
              <h3>{{ 'common.filter' | t }}</h3>
              <button class="close-icon" (click)="toggleFilter($event)">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="#111827" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <div class="popup-body">
              <div class="form-group">
                <label>{{ 'common.status' | t }}</label>
                <div class="custom-select">
                  <select [value]="statusFilter()" (change)="statusFilter.set($any($event.target).value)">
                    <option value="">{{ 'common.all' | t }}</option>
                    <option value="active">{{ 'common.active' | t }}</option>
                    <option value="expired">{{ 'ads.tab.inactive' | t }}</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label>{{ 'ads.published' | t }}</label>
                <div class="custom-select">
                  <select [value]="publishedFilter()" (change)="publishedFilter.set($any($event.target).value)">
                    <option value="">{{ 'common.all' | t }}</option>
                    <option value="true">{{ 'ads.published' | t }}</option>
                    <option value="false">{{ 'ads.unpublished' | t }}</option>
                  </select>
                </div>
              </div>

            </div>

            <div class="popup-footer">
              <button class="reset-btn" (click)="resetFilters()">{{ 'common.reset' | t }}</button>
              <button class="apply-btn" (click)="applyFilters()">{{ 'common.apply_filters' | t }}</button>
            </div>
          </div>
        }
      </div>
    </div>

    <button class="add-btn" (click)="onAdd()">{{ 'common.add' | t }}</button>
  </div>

  @if (loading()) {
    <p style="padding:24px;color:#6B7280;">{{ 'common.loading' | t }}</p>
  } @else if (!adsList().length) {
    <p style="padding:24px;color:#6B7280;">{{ 'ads.no_ads' | t }}</p>
  } @else {
    <div class="ads-grid">
      @for (ad of adsList(); track ad.id) {
        <div class="ad-card">
          <div class="card-image-wrapper">
            <img [src]="ad.image_url" alt="Healthcare Ad" class="ad-image" />

            <div class="card-actions">
              <button class="action-btn" (click)="onEdit(ad.id)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#374151" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5z" />
                </svg>
              </button>
              <button class="action-btn delete" (click)="onDelete(ad.id, $event)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#374151" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>

          <div class="card-footer">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#9CA3AF" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
            <span>{{ ad.redirect_link }}</span>
          </div>
        </div>
      }
    </div>
  }

</div>
