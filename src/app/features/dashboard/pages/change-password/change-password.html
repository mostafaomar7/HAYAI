<div class="page-container" style="padding:24px;">
  <div style="max-width:480px;margin:0 auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;">
    <h2 style="margin:0 0 24px;font-size:18px;color:#111827;">{{ 'password.title' | t }}</h2>

    <div class="form-group" style="margin-bottom:14px;">
      <label>{{ 'password.current' | t }}</label>
      <input type="password" [(ngModel)]="current_password" name="current_password" />
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>{{ 'password.new' | t }}</label>
      <input type="password" [(ngModel)]="new_password" name="new_password" />
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label>{{ 'password.confirm' | t }}</label>
      <input type="password" [(ngModel)]="new_password_confirmation" name="new_password_confirmation" />
    </div>

    @if (errorMsg()) { <p style="color:#dc2626;font-size:13px;">{{ errorMsg() }}</p> }
    @if (successMsg()) { <p style="color:#10b981;font-size:13px;">{{ successMsg() }}</p> }

    <div style="display:flex;justify-content:flex-end;margin-top:20px;">
      <button [disabled]="saving()" (click)="save()" style="padding:10px 24px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;">
        {{ (saving() ? 'password.updating' : 'password.update') | t }}
      </button>
    </div>
  </div>
</div>
