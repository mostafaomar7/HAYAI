<div class="page-container">

  <div class="notification-card">

    <div class="form-group">
      <label>{{ 'notif.send.title_label' | t }}</label>
      <input type="text" [placeholder]="'notif.send.title_placeholder' | t" [(ngModel)]="title" name="title" />
    </div>

    <div class="form-group">
      <label>{{ 'notif.send.body_label' | t }}</label>
      <textarea [placeholder]="'notif.send.body_placeholder' | t" rows="6" [(ngModel)]="body" name="body"></textarea>
    </div>

    <div class="form-group">
      <label>{{ 'notif.send.target_audience' | t }}</label>
      <div class="custom-select">
        <select [(ngModel)]="audience" name="audience">
          @for (a of audiences; track a.value) {
            <option [value]="a.value">{{ a.label }}</option>
          }
        </select>
      </div>
    </div>

    @if (errorMsg()) { <div style="color:#dc2626;font-size:13px;">{{ errorMsg() }}</div> }
    @if (successMsg()) { <div style="color:#10b981;font-size:13px;">{{ successMsg() }}</div> }

    <div class="form-actions">
      <button class="send-btn" [disabled]="sending()" (click)="sendNotification()">
        {{ (sending() ? 'notif.send.sending' : 'notif.send.send') | t }}
      </button>
    </div>

  </div>

</div>
