<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Google Search Console domain ownership. Play Console reads the verified
       domain from Search Console for developer-account verification, so this
       must stay on the home page and must not be moved or removed. -->
  <meta name="google-site-verification" content="U0QQyNmbhS2JLNWGSF9CkxM_vECDNMxFMgcQEnd_jf4" />
  <!-- Bing Webmaster Tools (SEO spec §9: a separate index that also feeds
       Copilot answers). Easiest path is "Import from Google Search Console",
       which needs no tag at all. If verifying by meta tag instead, paste the
       code here:
  <meta name="msvalidate.01" content="PASTE-BING-CODE-HERE" />
  -->
  <title>Hayai</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Consent defaults, page metadata and the tag manager container, in that
       order, built in src/server.ts. Public pages only. Do not add analytics,
       pixels or a second container anywhere else in this file: everything
       goes through the one container, and scripts/check-tracking.sh fails the
       build if a second copy appears. -->
  {{TRACKING_HEAD}}
  <!-- Content hash of assets/i18n/*.json, stamped by src/server.ts from the
       files on disk at startup. The dictionaries are fetched by XHR after
       bootstrap, so they are not covered by the bundle's content hashing and
       a cached copy cannot be dislodged by a reload. This tag is what lets
       the server cache them for a year instead of revalidating every load:
       the hash is derived from the file, so it cannot be stale. In `ng serve`
       the placeholder is left as-is and the app falls back to the bundle
       hash. -->
  <meta name="hayai-i18n-version" content="{{I18N_VERSION}}">
  <!-- Inter was already the declared body font but never loaded; Poppins is the
       display face used by the landing page design. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
  {{TRACKING_BODY}}
  <app-root></app-root>
</body>
</html>
